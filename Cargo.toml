[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/app"]
# The desktop app needs the platform webview's development files (webkit2gtk on Linux) and takes
# long to build; `cargo build`, `cargo test` and `cargo clippy` at the root leave it out. Build it
# with `-p code-automata-app` or `cargo tauri dev` / `cargo tauri build` in `crates/app`.
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "3.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/danted4/Code-Automata"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
