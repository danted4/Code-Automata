[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "3.0.0-alpha.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/danted4/Code-Automata"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
