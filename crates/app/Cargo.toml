[package]
name = "code-automata-app"
description = "The Code-Automata desktop app: the UI in a Tauri window, with the server in-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "code-automata"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
code-automata-core = { path = "../core" }
code-automata-server = { path = "../server" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "process"] }

[dev-dependencies]
tempfile = "3"
