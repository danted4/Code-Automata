[package]
name = "code-automata-core"
description = "Task store, run engine and git integration for Code-Automata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ca_core"

# Scripted stand-in for an agent CLI, used by tests and dev builds; never shipped.
[[bin]]
name = "mock-agent"
path = "src/bin/mock_agent.rs"

# Runs the engine on a project from the command line (manual runs, and the crash test).
[[bin]]
name = "ca-engine"
path = "src/bin/ca_engine.rs"

[lints]
workspace = true

[features]
# TypeScript bindings for the UI (`cargo test -p code-automata-core --features ts` writes them).
ts = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
# Job Objects: an agent and everything it starts are stopped together, and die with this process.
process-wrap = { version = "11", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
