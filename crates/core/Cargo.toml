[package]
name = "code-automata-core"
description = "Task store, run engine and git integration for Code-Automata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ca_core"

# Scripted stand-in for an agent CLI, used by tests and dev builds; never shipped.
[[bin]]
name = "mock-agent"
path = "src/bin/mock_agent.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["fs", "signal", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
