# Format, lint and test the Rust core (Code-Automata 3.0 migration).
name: Rust

on:
  push:
    branches: [main, v3-tauri]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'ui/src/lib/api/types/**'
      - 'ui/package.json'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'ui/src/lib/api/types/**'
      - 'ui/package.json'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep fixtures and test repositories byte-for-byte LF on Windows too.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked --no-fail-fast
      - name: Versions agree (Cargo.toml and ui/package.json)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo_v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          ui_v="$(node -p 'require("./ui/package.json").version')"
          if [ "$cargo_v" != "$ui_v" ]; then
            echo "::error::Cargo.toml says $cargo_v, ui/package.json says $ui_v"
            exit 1
          fi
      # The UI's TypeScript types are generated from the Rust types and committed; they must match.
      - name: TypeScript bindings are current
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -rf ui/src/lib/api/types
          cargo test -p code-automata-core -p code-automata-server --locked --features ts export_bindings
          changes="$(git status --porcelain ui/src/lib/api/types)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Regenerate them: rm -rf ui/src/lib/api/types && cargo test -p code-automata-core -p code-automata-server --features ts export_bindings"
            exit 1
          fi
